name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: salesos_admin, POSTGRES_PASSWORD: admin_pw, POSTGRES_DB: salesos }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgres://salesos_admin:admin_pw@localhost:5432/salesos
      DATABASE_URL: postgres://salesos_app:app_pw_local@localhost:5432/salesos
      DATABASE_SYSTEM_URL: postgres://salesos_system:system_pw_local@localhost:5432/salesos
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: PGPASSWORD=admin_pw psql -h localhost -U salesos_admin -d salesos -c "create database salesos_test"
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:setup
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: (npm start &) && npx wait-on http://localhost:3000/api/health && npm run test:e2e
